name: Sync CVE catalogue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cve-catalogue
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the mirror
        uses: actions/checkout@v7
        with:
          path: mirror

      - name: Check out the canonical CVE content
        uses: actions/checkout@v7
        with:
          repository: cradle-lang/cradle-lib
          path: source
          fetch-depth: 1
          sparse-checkout: heuristics/cve

      - name: Replace the mirrored catalogue
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            source/heuristics/cve/ mirror/

      - name: Commit and push changes
        shell: bash
        working-directory: mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "CVE catalogue is already up to date."
            exit 0
          fi

          source_sha="$(git -C ../source rev-parse HEAD)"
          git commit -m "Sync from cradle-lib@${source_sha}"
          git push origin HEAD:main
